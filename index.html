<!DOCTYPE html>
<html>
<head>
<title>PS4 [5.05] 7.00 - 13.00 FW GoldHEN Host</title>
<link rel="stylesheet" href="../style.css">
<style>
.loading-container {
    position: fixed;
    top: 50%;
    left: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    margin: 0;
    transform: translate(-50%, -50%);
    text-align: center;
}
.loading-spinner {
    width: 48px;
    height: 48px;
    border: 5px solid rgba(255, 255, 255, 0.3);
    border-top-color: #f31414;
    border-radius: 50%;
    animation: loading-spin 0.8s linear infinite;
}
.loading-status {
    font-size: 24px;
}
.goldhen-title {
    font-size: 42px;
    animation: goldhen-title-glow 2.4s ease-in-out infinite;
}
@keyframes goldhen-title-glow {
    0%, 100% {
        color: #f31414;
        text-shadow: 0 0 8px rgba(243, 20, 20, 0.8), 0 0 18px rgba(243, 20, 20, 0.5);
    }
    33% {
        color: #ffd700;
        text-shadow: 0 0 8px rgba(255, 215, 0, 0.8), 0 0 18px rgba(255, 215, 0, 0.5);
    }
    66% {
        color: #a855f7;
        text-shadow: 0 0 8px rgba(168, 85, 247, 0.8), 0 0 18px rgba(168, 85, 247, 0.5);
    }
}
@keyframes loading-spin {
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function completeJailbreak() {
    var spinner = document.getElementById("loading-spinner");
    var status = document.getElementById("loading-status");
    if (spinner) spinner.remove();
    if (status) status.textContent = "Jailbreak berhasil dijalankan!";
}

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Hanya untuk PS4 dengan Firmware 5.05 dan 7.00 hingga 13.00";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
<h1 class="goldhen-title">PS4 [5.05] 7.00 - 13.00 FW GoldHEN Host</h1>
<br>
<h1 id="msgs" class="loading-container">
<span id="loading-spinner" class="loading-spinner" aria-hidden="true"></span>
<span id="loading-status">Proses sedang berlangsung...</span>
</h1>
</body>
</html>
